<title>xIDC Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: ops console — left rail nav, top status bar, bento grid of panels; digital-twin views drawn in isometric SVG */
:root{
  --bg:#EEF1F5; --rail:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F6F9; --panel-3:#E9EDF2; --line:#DCE2EA;
  --fg:#0F1B2B; --muted:#5A6B80; --faint:#8C9AAD;
  --accent:#E08A12; --accent-2:#2F7DF6; --accent-soft:#FDEFD9; --accent-2-soft:#E3EDFE;
  --ok:#16A06A; --warn:#D08A00; --crit:#E0482F; --fatal:#B0185A;
  --ok-soft:#DDF4EA; --warn-soft:#FCF1D6; --crit-soft:#FCE3DD; --fatal-soft:#F7DDE8;
  --h0:#3E7BEF; --h1:#22B5C4; --h2:#7CC948; --h3:#F2B630; --h4:#EC5A34;
  --pr:#E0533F; --ps:#7D8A9C; --pt:#3F7CF0;
  --slab:#D9E0E9; --shadow:0 1px 2px rgba(15,27,43,.06),0 4px 16px rgba(15,27,43,.05);
  --ui:'IBM Plex Sans','IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --rail:#0D1624; --panel:#111C2C; --panel-2:#162336; --panel-3:#1C2B41; --line:#22324A;
  --fg:#E7EDF5; --muted:#9AABC0; --faint:#6B7E96;
  --accent:#F5A93A; --accent-2:#5B9BFF; --accent-soft:#33260F; --accent-2-soft:#14284A;
  --ok:#3DD598; --warn:#F5BD3D; --crit:#FF6E55; --fatal:#FF5C9D;
  --ok-soft:#10352A; --warn-soft:#3A2F12; --crit-soft:#41211B; --fatal-soft:#3F1730;
  --h0:#4C8DFF; --h1:#2CCBDA; --h2:#8EDB57; --h3:#F7C443; --h4:#FF6B45;
  --pr:#FF6B57; --ps:#A9B6C8; --pt:#5B9BFF;
  --slab:#1D2C42; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111C; --rail:#0D1624; --panel:#111C2C; --panel-2:#162336; --panel-3:#1C2B41; --line:#22324A;
  --fg:#E7EDF5; --muted:#9AABC0; --faint:#6B7E96;
  --accent:#F5A93A; --accent-2:#5B9BFF; --accent-soft:#33260F; --accent-2-soft:#14284A;
  --ok:#3DD598; --warn:#F5BD3D; --crit:#FF6E55; --fatal:#FF5C9D;
  --ok-soft:#10352A; --warn-soft:#3A2F12; --crit-soft:#41211B; --fatal-soft:#3F1730;
  --h0:#4C8DFF; --h1:#2CCBDA; --h2:#8EDB57; --h3:#F7C443; --h4:#FF6B45;
  --pr:#FF6B57; --ps:#A9B6C8; --pt:#5B9BFF;
  --slab:#1D2C42; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 12px}
.brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#F06A2C);display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--mono);font-size:13px}
.brand b{font-size:17px}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.rail .grp{font-size:11px;letter-spacing:.08em;color:var(--faint);padding:10px 10px 3px;text-transform:uppercase}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.rail button svg{width:18px;height:18px;flex:none}
.rail button:hover{background:var(--panel-2);color:var(--fg)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.rail button[aria-current="page"] svg{color:var(--accent)}
.rail .new{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--accent-2-soft);color:var(--accent-2)}
.rail .foot{margin-top:auto;padding:12px 10px 0;font-size:11px;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.crumb{font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.chips{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.chips button{background:none;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.iconbtn{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.iconbtn svg{width:16px;height:16px}
.badge{min-width:18px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-family:var(--mono);font-size:11px;text-align:center;line-height:18px}
.content{padding:20px 24px 32px;display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr));align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ch h3{font-size:14px;margin:0;font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1180px){.c2,.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .rail .grp,.rail .foot,.brand small,.rail .new{display:none}
  .brand{padding:0 8px 0 0}
  .rail button{width:auto;white-space:nowrap}
  .top{position:static}.content{padding:16px}
}
@media (max-width:560px){.c2,.c3{grid-column:span 12}}
.kpi{gap:6px}
.kpi .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .d{font-size:12px;font-family:var(--mono)}
.up{color:var(--crit)}.down{color:var(--ok)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
svg .lbl{fill:var(--fg);font-family:var(--ui);font-size:12px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 86px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;border-radius:999px;background:var(--panel-3);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px;transition:width .6s}
.bar .n{text-align:right;font-family:var(--mono)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-warn,.sev-Warning,.st-ack{background:var(--warn-soft);color:var(--warn)}
.s-crit,.sev-Critical,.st-open{background:var(--crit-soft);color:var(--crit)}.sev-Fatal{background:var(--fatal-soft);color:var(--fatal)}
.st-closed,.s-off{background:var(--panel-3);color:var(--muted)}
.s-info{background:var(--accent-2-soft);color:var(--accent-2)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#1A1205}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:12px}
select.f,input.f{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{font-weight:600}
.li .grow .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.r{text-align:right}
tbody tr:hover{background:var(--panel-2)}
tr.sel td{background:var(--panel-2)}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border-radius:10px;padding:10px 12px;min-width:0}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:600;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:28px 8px}
.hit{cursor:pointer}.hit:hover{filter:brightness(1.12)}
.switch{position:relative;width:38px;height:22px;border-radius:999px;background:var(--panel-3);border:1px solid var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.board{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mainbrk{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:640px){.cols,.cols3{grid-template-columns:1fr}}
.brk{display:grid;grid-template-columns:24px 22px minmax(0,1fr) 54px 50px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:12px;text-align:left;width:100%}
.brk[aria-pressed="true"]{border-color:var(--accent-2);box-shadow:0 0 0 2px var(--accent-2-soft)}
.brk .no{font-family:var(--mono);color:var(--faint)}
.ph{display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 3px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff}
.ph-R{background:#D9473A}.ph-S{background:#56616F}.ph-T{background:#2F6FE0}.ph-3P{background:#7A4FD6}
.brk .ld{height:6px;border-radius:999px;background:var(--panel-3);overflow:hidden}
.brk .ld i{display:block;height:100%;border-radius:999px}
.brk .a{font-family:var(--mono);text-align:right}
.elev{display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.u{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:stretch;font-size:11px}
.u .n{font-family:var(--mono);color:var(--faint);text-align:right;line-height:14px}
.dev{border-radius:4px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;background:var(--panel);border:1px solid var(--line);overflow:hidden;white-space:nowrap}
.dev b{font-family:var(--mono);font-weight:600}
.slot{border-radius:3px;border:1px dashed var(--line);height:14px}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
.unit{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.unit .h{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.dots{display:grid;grid-template-columns:1fr auto;gap:2px 8px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.chc{border-radius:6px;padding:4px 5px;font-size:10px;font-family:var(--mono);line-height:1.25;color:#0F1B2B;min-width:0;overflow:hidden;white-space:nowrap}
.chc b{display:block;font-size:11px}
.spec{display:flex;flex-wrap:wrap;gap:6px}
.spec span{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.tree{display:flex;flex-direction:column;gap:4px}
.tree .g{font-size:11px;color:var(--faint);letter-spacing:.06em;margin-top:8px}
.tree button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer}
.tree button[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.chk{display:grid;grid-template-columns:minmax(0,1fr) 120px 220px;gap:10px;align-items:center;padding:10px 12px;background:var(--panel-2);border-radius:10px}
@media (max-width:700px){.chk{grid-template-columns:1fr}}
.chk .t b{display:block;font-weight:600}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 label{padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted);background:var(--panel)}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 label:has(input:checked){background:var(--panel-3);color:var(--fg);font-weight:600}
.seg2 label.badc:has(input:checked){background:var(--crit-soft);color:var(--crit)}
.numin{width:96px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-family:var(--mono)}
.numin.bad{border-color:var(--crit);color:var(--crit)}
.range{height:6px;border-radius:999px;background:var(--panel-3);position:relative;margin-top:6px}
.range i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 45%,transparent);border-radius:999px}
.range b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--fg)}
.ins{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ins:last-child{border-bottom:0}
.ins .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--mono)}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(0,0,0,.25);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.toast .row{justify-content:space-between}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="menu"></nav>
  <div class="main">
    <div class="top">
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <div class="chips" id="centers" role="group"></div>
      <span class="live" id="live"></span>
      <button class="iconbtn" id="langBtn" type="button"></button>
      <button class="iconbtn" id="themeBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button class="iconbtn" id="bell" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></svg><span class="badge" id="bellCnt">0</span></button>
    </div>
    <main class="content" id="view" aria-live="polite"></main>
  </div>
</div>
<div class="toast" id="toast" hidden role="alertdialog" aria-labelledby="toastMsg">
  <div class="row"><strong id="toastH"></strong><span class="pill" id="toastSev"></span></div>
  <div id="toastMsg" style="font-size:13px"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn sm" id="toastAck" type="button"></button><button class="btn sm pri" id="toastGo" type="button"></button></div>
</div>

<script>
const DEFAULT_LANG='en';
(function(){
'use strict';
const $=s=>document.querySelector(s), V=$('#view');
/* ---------- language & boot tokens: #view.dark.en ---------- */
const TOK=location.hash.slice(1).split('.');
let LANG=DEFAULT_LANG; try{const l=localStorage.getItem('xidc-lang');if(l==='en'||l==='ko')LANG=l}catch(e){}
if(TOK.includes('en'))LANG='en'; if(TOK.includes('ko'))LANG='ko';
document.documentElement.lang=LANG;
const EN=LANG==='en', L=(k,e)=>EN?e:k;
let seed=20131015; const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const hrnd=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);let x=h>>>0;return()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296}};
const pick=a=>a[Math.floor(rnd()*a.length)];
const LOC=EN?'en-US':'ko-KR';
const fmt=(n,d=0)=>Number(n).toLocaleString(LOC,{minimumFractionDigits:d,maximumFractionDigits:d});
const kfmt=kw=>kw>=1000?fmt(kw/1000,2)+' MW':fmt(kw,kw<100?1:0)+' kW';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=(n,l=2)=>String(n).padStart(l,'0');
const now=()=>new Date();
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;

function curMeter(){const ms=meters(room());if(selMeter>=ms.length)selMeter=0;return ms[selMeter]}

  return m.ch.map((c,i)=>{const kw=feedKW(c.k,c.side),ph=ai?'3P':m._ph[i];return {no:i+1,ph,kw,a:amps(kw,ai?3:1),brk:ai?63:32,k:c.k,side:c.side}})}
const meterSel=()=>`<select class="f" id="meterSel" aria-label="${L('분전반·계측기','Panel / meter')}">${meters(room()).map((m,i)=>`<option value="${i}" ${i===selMeter?'selected':''}>${m.panel} · ${m.id}</option>`).join('')}</select>`;
function vPanel(){

  const all=tot.R+tot.S+tot.T, avg=all/3, imb=(Math.max(tot.R,tot.S,tot.T)-Math.min(tot.R,tot.S,tot.T))/avg*100, mx=Math.max(tot.R,tot.S,tot.T)*1.15;

  const ncol=ai?2:3, per=Math.ceil(cs.length/ncol); let colsH='';for(let i=0;i<ncol;i++)colsH+=`<div style="display:flex;flex-direction:column;gap:4px">${cs.slice(i*per,(i+1)*per).map(brk).join('')}</div>`;

  return `<div class="card c8"><div class="ch"><div><h3>${m.panel} · ${L('계측','metered by')} ${m.id} (gems3736 ${m.mode})</h3><span class="sub">${L('막대 = 차단기 용량 대비 전류 · 값 = 실사용 kW / A · 회로를 누르면 매핑이 열립니다','bar = current vs breaker · values = measured kW / A · select a circuit for mapping')}</span></div>${meterSel()}</div>
    <div class="board"><div class="mainbrk"><div><b>${L('메인 차단기','Main breaker')}</b> <span class="sub">${ai?'ACB 2000A':'MCCB 400A'} · ${L('3상 4선 380/220 V · 메인 CT','3-phase 4-wire 380/220 V · main CT')} ${m.mainCT}</span></div><span class="num" style="font-weight:600">${fmt(all,1)} kW · ${fmt(amps(all,3),0)} A · PF ${(.955+((m.seed*3)%3)/100).toFixed(2)} · ${L('누설','leakage')} ${m.leak} mA</span></div>
    <div class="cols ${ai?'':'cols3'}">${colsH}</div></div></div>
  <div class="card c4"><div class="ch"><h3>${L('상별 부하 균형','Phase balance')}</h3><span class="pill s-${imb>15?'warn':'ok'}">${L('불평형','Imbalance')} ${imb.toFixed(1)}%</span></div>
    <svg viewBox="0 0 250 166" class="chart" role="img" aria-label="${L('상별 전력','Power per phase')}">${phBars}<line x1="16" x2="236" y1="${140-avg/mx*120}" y2="${140-avg/mx*120}" stroke="var(--faint)" stroke-dasharray="4 4"/></svg>
    <div class="ch"><h3>${L('회로','Circuit')} ${pad(sel.no)}</h3><span class="ph ph-${sel.ph}">${sel.ph}</span></div>
    <div class="stats"><div class="stat"><span class="l">${L('매핑 랙 · 피드','Rack · feed')}</span><span class="v">${sel.k.empty?L('예비','Spare'):sel.k.id+' · '+sel.side}</span></div><div class="stat"><span class="l">${L('실사용 전력','Measured power')}</span><span class="v">${sel.kw.toFixed(2)} kW</span></div><div class="stat"><span class="l">${L('전류 / 차단기','Current / breaker')}</span><span class="v">${sel.a.toFixed(1)} / ${sel.brk} A</span></div><div class="stat"><span class="l">${L('분기 CT','Branch CT')}</span><span class="v" style="font-size:13px">${m.brCT}</span></div></div>
    <div><div class="sub">${L('최근 12시간 kW','kW, last 12 h')}</div>${spark(Array.from({length:12},(_,i)=>sel.kw*(1+Math.sin(i*.8+sel.no)*.06)),280,50,'var(--accent-2)')}</div></div>`;
}

function vRack(){

  const bmc=srv.reduce((a,s)=>a+s.share*k.kw,0);

      <div class="row" style="gap:22px;justify-content:space-between">

function vQuality(){
  const m=curMeter(), g=hrnd(m.id), vt=[2.1+g(),2.4+g(),2.2+g()], tdd=6+g()*6, vu=.3+g()*.4, iu=3+g()*5, fq=59.97+g()*.05, kf=1.6+g()*.8, cf=1.45+g()*.25;
  const tiles=[[L('전압 THD (최대상)','Voltage THD (max)'),Math.max(...vt).toFixed(2)+' %','EN50160 ≤ 8%'],[L('전류 TDD','Current TDD'),tdd.toFixed(1)+' %','IEEE 519'],[L('전압 불평형','Voltage unbalance'),vu.toFixed(2)+' %','≤ 2%'],[L('전류 불평형','Current unbalance'),iu.toFixed(1)+' %',''],[L('주파수','Frequency'),fq.toFixed(2)+' Hz','60 Hz'],['K-factor · CF',kf.toFixed(2)+' · '+cf.toFixed(2),L('변압기 열화 지표','transformer derating')]]

  let di='';for(let i=0;i<=200;i++){const t=i/200,a=t*4*Math.PI;di+=(i?'L':'M')+x(t).toFixed(1)+','+y(.62*(Math.sin(a)+.18*Math.sin(5*a)+.09*Math.sin(7*a))).toFixed(1)}

  [0,2,4,6,8].forEach(v=>{const yy=HH-24-v/8*(HH-40);hb+=`<line x1="36" x2="${HW-8}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="30" y="${yy+4}" text-anchor="end">${v}%</text>`});
  // ITIC
  const IW=560,IH=230,lx=t=>50+(Math.log10(t)+4)/6*(IW-64),ly=v=>14+(1-v/200)*(IH-44);
  const up=[[1e-4,200],[1e-3,200],[1e-3,140],[3e-3,140],[3e-3,120],[.5,120],[.5,110],[100,110]], lo=[[1e-4,0],[.02,0],[.02,70],[.5,70],[.5,80],[10,80],[10,90],[100,90]];

  [[1e-4,'0.1ms'],[1e-3,'1ms'],[.01,'10ms'],[.1,'0.1s'],[1,'1s'],[10,'10s'],[100,'100s']].forEach(([t,l])=>it+=`<line x1="${lx(t)}" x2="${lx(t)}" y1="14" y2="${IH-30}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${lx(t)}" y="${IH-12}" text-anchor="middle">${l}</text>`);

  const en=[[L('주파수','Frequency'),'99.9 %'],[L('공급 전압 변동','Supply voltage'),'100 %'],[L('플리커 Plt','Flicker Plt'),'99.6 %'],[L('불평형','Unbalance'),'100 %'],[L('전압 THD','Voltage THD'),'100 %'],[L('개별 고조파','Individual harmonics'),'99.8 %']];

    <div class="tbl"><table><thead><tr><th>${L('발생','Time')}</th><th>${L('종류','Type')}</th><th class="r">${L('잔류 전압','Residual V')}</th><th class="r">${L('지속','Duration')}</th><th>${L('판정','Result')}</th></tr></thead><tbody>${evl}</tbody></table></div></div>

function vInspect(){

    if(it[2]!=='num'){const v=inspVals[key]||'ok';const lb=it[2]==='onoff'?['OFF','ON']:[L('양호','Normal'),L('이상','Fault')];ctl=`<span class="seg2" role="radiogroup" aria-label="${it[0]}"><label><input type="radio" name="i${i}" value="ok" ${v==='ok'?'checked':''}><span>${lb[0]}</span></label><label class="badc"><input type="radio" name="i${i}" value="bad" ${v==='bad'?'checked':''}><span>${lb[1]}</span></label></span>`}
    else{const v=inspVals[key]??it[6], bad=v<it[3]||v>it[4]||isNaN(v), lo=it[3]-(it[4]-it[3])*.3, hi=it[4]+(it[4]-it[3])*.3, pos=Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));

  $('#bellCnt').textContent=events.filter(e=>e.state==='open').length;
}
function go(v){view=v;render();try{localStorage.setItem('xidc-view',v)}catch(e){};window.scrollTo(0,0)}

/* ---------- interactions ---------- */
$('#rail').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)go(b.dataset.v)});
$('#centers').addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(!b)return;ci=+b.dataset.ci;ri=0;selMeter=0;selCust=0;selRack=room().racks.find(k=>!k.empty).id;render()});
V.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-room],[data-rack],[data-mode],[data-circ],[data-evf],[data-ev],[data-ack],[data-close],[data-rpt],[data-cyc],[data-ti],[data-map],[data-meter],[data-cust],#ackAll,#ndcpAuto,#ndcpSend,#rptAuto,#mapApply,#circSave');
  if(!t)return; const d=t.dataset;
  if(d.go)return go(d.go);
  if(d.room!==undefined){ri=+d.room;selMeter=0;selRack=room().racks.find(k=>!k.empty).id;return render()}
  if(d.rack){selRack=d.rack;return render()}
  if(d.mode){mode=d.mode;return render()}
  if(d.circ){selCirc=+d.circ;return render()}
  if(d.meter){const[a,b]=d.meter.split(':');ri=+a;selMeter=+b;return render()}
  if(d.cust!==undefined){selCust=+d.cust;return render()}
  if(d.evf!==undefined){evFilter=d.evf;return render()}
  if(d.ack||d.close){const ev=events.find(x=>x.id==(d.ack||d.close));if(ev)ev.state=d.ack?'ack':'closed';return render()}
  if(d.ev){selEv=+d.ev;return render()}
  if(d.rpt){rptTab=d.rpt;return render()}
  if(d.cyc){rptCycle=d.cyc;return render()}
  if(d.ti!==undefined){ti=+d.ti;return render()}
  if(d.map){mapSel=d.map;mapSaved='';return render()}
  if(t.id==='ackAll'){events.forEach(x=>{if(x.state==='open')x.state='ack'});return render()}
  if(t.id==='ndcpAuto'){ndcpAuto=!ndcpAuto;return render()}
  if(t.id==='ndcpSend'){ndcpReq.unshift({t:`${pad(now().getMonth()+1)}/${pad(now().getDate())} ${hm(now())}`,m:L(`${$('#ndcpU').value} 출력전압 ${$('#ndcpV').value} V 설정`,`${$('#ndcpU').value}: set output ${$('#ndcpV').value} V`),s:'pending'});render();setTimeout(()=>{ndcpReq[0].s='done';if(view==='ndcp')render()},3000);return}
  if(t.id==='rptAuto'){rptAuto=!rptAuto;return render()}
  if(t.id==='mapApply'){const k=room().racks.find(x=>x.id===mapSel);if(k)k.mapped=true;mapSaved=L(`${mapSel}에 매핑했습니다`,`Mapped to ${mapSel}`);return render()}
  if(t.id==='circSave'){t.textContent=L('저장했습니다','Saved');t.disabled=true;return}
});
V.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.hit')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
V.addEventListener('change',e=>{const id=e.target.id;
  if(id==='roomSel'){ri=+e.target.value;selMeter=0;selRack=room().racks.find(k=>!k.empty).id;render()}
  if(id==='rackSel'){selRack=e.target.value;render()}
  if(id==='meterSel'){selMeter=+e.target.value;selCirc=1;render()}
  if(id==='wiN'||id==='wiK'){wiN=Math.max(0,+$('#wiN').value||0);wiK=Math.max(1,+$('#wiK').value||1);render()}
  if(e.target.name&&/^i\d+$/.test(e.target.name)&&e.target.type==='radio'){inspVals[ti+'-'+e.target.name.slice(1)]=e.target.value;render()}
  if(e.target.classList.contains('numin')){inspVals[ti+'-'+e.target.name.slice(1)]=parseFloat(e.target.value);render()}
});
V.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='inspForm'){const t=TARGETS[ti];let bad=0;t.items.forEach((it,i)=>{const v=inspVals[ti+'-'+i];if(it[2]==='num'){const n=v??it[6];if(isNaN(n)||n<it[3]||n>it[4])bad++}else if(v==='bad')bad++});
    hist.unshift({d:`2026-10-25 ${hm(now())}`,t:t.name,c:t.cyc,who:$('#who').value||'—',bad,n:t.items.length});render();$('#saved').textContent=bad?L(`등록했습니다 · 이상 ${bad}건`,`Submitted · ${bad} fault(s)`):L('등록했습니다 · 전 항목 양호','Submitted · all normal')}
  if(e.target.id==='rptForm'){reports.unshift({n:`${$('#rptTarget').value} · ${rptCycle}`,p:L('2026-10-25 생성','Created 2026-10-25'),auto:rptAuto});render()}
});
let queue=[];
function toast(ev){queue.push(ev);const f=queue[0];$('#toastSev').className='pill sev-'+f.sev;$('#toastSev').textContent=f.sev;$('#toastMsg').textContent=f.msg+' · '+f.where+(queue.length>1?L(` 외 ${queue.length-1}건`,` +${queue.length-1} more`):'');$('#toast').hidden=false}
$('#toastAck').addEventListener('click',()=>{queue.forEach(x=>{if(x.state==='open')x.state='ack'});queue=[];$('#toast').hidden=true;render()});
$('#toastGo').addEventListener('click',()=>{selEv=queue[0]?.id||selEv;queue=[];$('#toast').hidden=true;go('alarms')});
$('#bell').addEventListener('click',()=>{evFilter='open';go('alarms')});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('xidc-theme',r.dataset.theme)}catch(e){}});
$('#langBtn').addEventListener('click',()=>{try{localStorage.setItem('xidc-lang',EN?'ko':'en');localStorage.setItem('xidc-view',view)}catch(e){};location.hash=view;location.reload()});
function tick(){SITES.forEach(s=>s.rooms.forEach(r=>r.racks.forEach(k=>{if(k.empty)return;const j=k.type==='gpu'?.08:.03;k.kw=Math.max(.2,Math.min(k.cap*.99,k.base*(1+(rnd()-.5)*2*j)));k.inlet=Math.max(18,k.inletB+(rnd()-.5)*.6)})));
  const a=document.activeElement; if(LIVE.has(view)&&!(a&&V.contains(a)&&a.matches('input,select')))render()}

/* boot */
const hv=TOK[0], ht=TOK.find(x=>x==='dark'||x==='light');
let stv=null;try{stv=localStorage.getItem('xidc-view');const th=localStorage.getItem('xidc-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(ht)document.documentElement.dataset.theme=ht;
view=VIEWS[hv]?hv:(VIEWS[stv]?stv:'overview');
render();
if(!ht){setInterval(tick,4000);setInterval(()=>{if(document.visibilityState==='visible'){const ev=newEvent(0);events.unshift(ev);toast(ev);render()}},30000)}
})();
</script>
